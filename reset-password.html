<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="تعيين كلمة مرور جديدة | منصة موثوق">
<title>تعيين كلمة مرور جديدة | منصة موثوق</title>
<link rel="icon" type="image/png" href="mawthouq-logo.png">
<link rel="apple-touch-icon" href="mawthouq-logo.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#10172F">
<link rel="stylesheet" href="assets/style.css?v=31">
<link rel="stylesheet" href="assets/refresh.css?v=2">
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
  <button class="back-btn" onclick="goBack('login.html')" aria-label="رجوع">→</button>
  <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">م</span><span>منصة موثوق</span></a>
  </div>
  <nav></nav>
  <div class="actions"></div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div id="checkingView">
      <h1>جارٍ التحقق...</h1>
      <p>لحظات من فضلك.</p>
    </div>

    <div id="expiredView" style="display:none">
      <h1>انتهت صلاحية الرابط</h1>
      <p>رابط الاستعادة صالح لفترة محدودة فقط. اطلب رابطًا جديدًا من صفحة تسجيل الدخول.</p>
      <div class="auth-foot"><a href="login.html">→ الذهاب لتسجيل الدخول</a></div>
    </div>

    <div id="resetView" style="display:none">
      <h1>تعيين كلمة مرور جديدة</h1>
      <p>أدخلي كلمة المرور الجديدة لحسابك.</p>

      <div id="alert" class="alert alert-error"></div>

      <form id="newPasswordForm" novalidate>
        <div class="field">
          <label for="newPassword">كلمة المرور الجديدة</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirmNewPassword">تأكيد كلمة المرور</label>
          <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" id="submitBtn"><span class="spinner"></span><span class="btn-text">حفظ كلمة المرور</span></button>
      </form>
    </div>

    <div id="successView" style="display:none">
      <h1>تم تحديث كلمة المرور</h1>
      <p>يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.</p>
      <a href="login.html"><button style="width:100%">الذهاب لتسجيل الدخول</button></a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js?v=31"></script>
<script>
function goBack(fallback){
  if (window.history.length > 1) { window.history.back(); }
  else { window.location.href = fallback || 'login.html'; }
}

function showView(name){
  ['checkingView','expiredView','resetView','successView'].forEach(id => {
    document.getElementById(id).style.display = (id === name) ? 'block' : 'none';
  });
}

// Supabase يعالج رمز الاستعادة الموجود برابط البريد تلقائيًا عند تحميل
// الصفحة وينشئ جلسة مؤقتة صالحة فقط لتحديث كلمة المرور
let recoveryReady = false;

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    recoveryReady = true;
    showView('resetView');
  }
});

(async function checkRecoverySession(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session && !recoveryReady) {
    recoveryReady = true;
    showView('resetView');
    return;
  }
  // مهلة قصيرة لإعطاء onAuthStateChange فرصة يعالج الرابط قبل اعتباره منتهي الصلاحية
  setTimeout(() => {
    if (!recoveryReady) showView('expiredView');
  }, 2500);
})();

document.getElementById('newPasswordForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('alert');
  const submitBtn = document.getElementById('submitBtn');
  const newPassword = document.getElementById('newPassword').value;
  const confirmNewPassword = document.getElementById('confirmNewPassword').value;

  alertBox.classList.remove('show');

  if (newPassword.length < 8) {
    alertBox.textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل.';
    alertBox.classList.add('show');
    return;
  }
  if (newPassword !== confirmNewPassword) {
    alertBox.textContent = 'كلمتا المرور غير متطابقتين.';
    alertBox.classList.add('show');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.classList.add('loading');

  const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

  if (error) {
    alertBox.textContent = 'تعذر تحديث كلمة المرور: ' + error.message;
    alertBox.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.classList.remove('loading');
    return;
  }

  showView('successView');
});
</script>
</body>
</html>
