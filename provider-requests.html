<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="طلبات الخدمة - منصة موثوق">
<title>طلبات الخدمة | منصة موثوق</title>
<link rel="icon" type="image/png" href="mawthouq-logo.png">
<link rel="apple-touch-icon" href="mawthouq-logo.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1a2140">
<link rel="stylesheet" href="assets/style.css?v=31">
<link rel="stylesheet" href="assets/refresh.css?v=2">
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
  <button class="back-btn" onclick="goBack('index.html')" aria-label="رجوع">→</button>
  <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">م</span><span>منصة موثوق</span></a>
  </div>
  <nav><a href="index.html">الرئيسية</a></nav>
  <div class="actions" id="headerActions">
    <a href="provider-services.html" class="outline btn">خدماتي</a>
    <a href="messages.html" class="ghost btn">رسائلي</a>
    <button class="ghost" onclick="logoutUser()">خروج</button>
  </div>
</header>

<main style="padding:34px 7%">
  <section class="identity-panel" aria-labelledby="identityTitle">
    <div><h2 id="identityTitle">توثيق هوية مقدم الخدمة</h2><p id="identityStatus" aria-live="polite">جارٍ التحقق من حالة الطلب...</p></div>
    <form id="identityForm" hidden>
      <label for="identityFile">البطاقة المدنية، اختياري (JPG أو PNG أو PDF حتى 5 ميجابايت)</label>
      <input id="identityFile" type="file" accept="image/jpeg,image/png,application/pdf" required>
      <label class="consent-row"><input id="identityConsent" type="checkbox" required><span>أوافق على فحص البطاقة للتحقق من هويتي وفق <a href="privacy.html" target="_blank" rel="noopener">سياسة الخصوصية</a>. لا تُنشر البطاقة ولا تمنح الشارة قبل مراجعة المشرف.</span></label>
      <button id="identitySubmit" type="submit">إرسال البطاقة للمراجعة</button>
    </form>
  </section>
  <div class="heading">
    <div><div class="eyebrow">مقدّم خدمة</div><h1 style="margin:5px 0">طلبات الخدمة المتاحة</h1></div>
    <p id="myServiceType"></p>
  </div>

  <div class="search-bar" style="max-width:100%"><span>⌕</span><input id="searchInput" placeholder="ابحث بالعنوان أو التفاصيل أو التخصص..." oninput="applyFilters()"></div>

  <div class="form" style="margin-bottom:26px">
    <div class="field">
      <label>تصفية حسب الخدمة</label>
      <select id="serviceFilter" onchange="applyFilters()">
        <option value="">كل الخدمات</option>
      </select>
    </div>
    <div class="field">
      <label>تصفية حسب التخصص</label>
      <select id="specFilter" onchange="applyFilters()">
        <option value="">كل التخصصات</option>
        <option>الإدارة</option>
        <option>التربية</option>
        <option>القانون</option>
        <option>الاقتصاد</option>
        <option>الهندسة</option>
        <option>تقنية المعلومات</option>
        <option>العلوم الاجتماعية</option>
        <option>العلوم الإنسانية</option>
      </select>
    </div>
  </div>

  <div class="admin-tabs">
    <button class="tab-btn active" id="tabBtnAvailable" onclick="switchRequestsTab('available')">الطلبات المتاحة</button>
    <button class="tab-btn" id="tabBtnArchive" onclick="switchRequestsTab('archive')">أرشيف طلباتي</button>
  </div>

  <div id="tab-available" class="admin-tab active">
    <div id="requestsList" class="service-grid" style="grid-template-columns:repeat(2,1fr)">
      <p style="color:var(--muted)">جارٍ التحميل...</p>
    </div>
    <div id="emptyState" style="display:none;color:var(--muted);text-align:center;padding:40px 0">لا توجد طلبات تطابق البحث.</div>
  </div>

  <div id="tab-archive" class="admin-tab">
    <div class="table-wrap">
      <table>
        <thead><tr><th>العنوان</th><th>الخدمة</th><th>الطالب</th><th>الحالة</th><th>التاريخ</th></tr></thead>
        <tbody id="archiveBody">
          <tr><td colspan="5"><div class="skeleton" style="width:100%"></div></td></tr>
        </tbody>
      </table>
      <div id="archiveEmpty" class="empty-state" style="display:none">لم تقبل أي طلب بعد.</div>
    </div>
  </div>
</main>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box"><button class="close" onclick="closeModal()" aria-label="إغلاق">×</button><div id="modalBody"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js?v=31"></script>
<script src="assets/auth.js?v=32"></script>
<script src="assets/provider-identity.js?v=1"></script>
<script src="assets/provider-requests.js?v=32"></script>
</body>
</html>
