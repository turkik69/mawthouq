<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
  <button class="back-btn" onclick="goBack('index.html')" aria-label="رجوع">→</button>
  <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">م</span><span>منصة موثوق</span></a>
  </div>
  <nav><a href="my-requests.html">طلباتي</a><a href="messages.html">رسائلي</a></nav>
  <div class="actions" id="headerActions"><button class="ghost" onclick="logoutUser()">خروج</button></div>
</header>

<main style="padding:36px 7%;max-width:1100px;margin:0 auto">
  <div id="dashWelcome" class="dash-welcome">
    <h1>أهلًا بك<span id="dashName"></span></h1>
    <p>ماذا تريد أن تنجز اليوم؟</p>
    <button class="large" onclick="window.location.href='index.html?action=request'">+ إنشاء مشروع جديد</button>

  <div class="dash-grid">
    <div>
      <div class="dash-section-head"><h2>مشاريعك</h2><a href="my-requests.html" class="link">عرض الكل ←</a></div>
      <div class="rt-grid" id="dashProjects">
        <div class="skeleton" style="height:80px;border-radius:16px"></div>
        <div class="skeleton" style="height:80px;border-radius:16px"></div>
      </div>
      <div id="dashProjectsEmpty" class="empty-state" style="display:none">لا توجد مشاريع حتى الآن. <a href="index.html">ابدأ مشروعك الأول من الرئيسية</a>.</div>
    </div>

    <div>
      <div class="dash-section-head"><h2>آخر النشاطات</h2></div>
      <div class="dash-activity" id="dashActivity">
        <div class="skeleton" style="height:20px;border-radius:8px;margin-bottom:14px"></div>
        <div class="skeleton" style="height:20px;border-radius:8px"></div>
      </div>
      <div id="dashActivityEmpty" class="empty-state" style="display:none;padding:30px 10px">لا توجد نشاطات حتى الآن.</div>
    </div>
  </div>
</main>
