<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="تسجيل الدخول إلى منصة موثوق">
<title>تسجيل الدخول | منصة موثوق</title>
<link rel="icon" type="image/png" href="mawthouq-logo.png">
<link rel="apple-touch-icon" href="mawthouq-logo.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1a2140">
<link rel="stylesheet" href="assets/style.css?v=31">
<link rel="stylesheet" href="assets/refresh.css?v=2">
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
  <button class="back-btn" onclick="goBack('index.html')" aria-label="رجوع">→</button>
  <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">م</span><span>منصة موثوق</span></a>
  </div>
  <nav><a href="index.html#services">الخدمات</a><a href="index.html#how">كيف تعمل؟</a><a href="index.html#experts">الخبراء</a></nav>
  <div class="actions"><a href="register.html" class="outline btn">إنشاء حساب</a></div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div id="loginView">
      <h1>تسجيل الدخول</h1>
      <p>أدخل بيانات حسابك للمتابعة إلى منصة موثوق.</p>

      <div id="alert" class="alert alert-error"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">البريد الإلكتروني</label>
          <input id="username" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="submitBtn"><span class="spinner"></span><span class="btn-text">دخول</span></button>
      </form>

      <div class="auth-foot" style="margin-top:14px"><a href="#" onclick="showResetView(event)">نسيت رمز الدخول؟</a></div>
      <div class="auth-foot">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></div>
    </div>

    <div id="resetView" style="display:none">
      <h1>استعادة رمز الدخول</h1>
      <p>أدخل بريدك المسجّل، وسنرسل رابطًا لتعيين كلمة مرور جديدة.</p>

      <div id="resetAlert" class="alert alert-success"></div>

      <form id="resetForm" novalidate>
        <div class="field">
           <label for="resetUsername">البريد الإلكتروني</label>
           <input id="resetUsername" type="email" autocomplete="email" required>
        </div>
        <button type="submit" id="resetSubmitBtn"><span class="spinner"></span><span class="btn-text">إرسال رابط الاستعادة</span></button>
      </form>

      <div class="auth-foot"><a href="#" onclick="showLoginView(event)">→ رجوع لتسجيل الدخول</a></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js?v=31"></script>
<script src="assets/auth.js?v=31"></script>
<script>
function showResetView(e){
  e.preventDefault();
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('resetView').style.display = 'block';
}
function showLoginView(e){
  e.preventDefault();
  document.getElementById('resetView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const resetAlert = document.getElementById('resetAlert');
  const resetBtn = document.getElementById('resetSubmitBtn');
   const email = document.getElementById('resetUsername').value.trim();

  resetBtn.disabled = true;
  resetBtn.classList.add('loading');

   // رسالة موحّدة تمنع كشف وجود الحساب.
  const genericMessage = 'إذا كان الحساب موجودًا، سيصلك رابط استعادة على بريده المسجّل خلال دقائق.';

  try {
     await supabaseClient.auth.resetPasswordForEmail(email, {
       redirectTo: new URL('reset-password.html', window.location.href).href
     });
  } catch (err) {
    // نتجاهل تفاصيل الخطأ عمدًا هنا لنفس سبب الرسالة الموحّدة
  }

  resetAlert.textContent = genericMessage;
  resetAlert.classList.add('show');
  resetBtn.disabled = false;
  resetBtn.classList.remove('loading');
  document.getElementById('resetForm').reset();
});

const form = document.getElementById('loginForm');
const alertBox = document.getElementById('alert');
const submitBtn = document.getElementById('submitBtn');

function showError(msg){
  alertBox.textContent = msg;
  alertBox.className = 'alert alert-error show';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertBox.className = 'alert alert-error';
  submitBtn.disabled = true;
  submitBtn.classList.add('loading');

   const email = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
     await loginUser({ email, password });
    await redirectAfterAuth();
  } catch (err) {
    showError(err.message);
    submitBtn.disabled = false;
    submitBtn.classList.remove('loading');
  }
});
initInstallPrompt();
</script>
</body>
</html>
