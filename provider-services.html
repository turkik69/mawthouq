<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="خدماتي وأسعاري - منصة موثوق">
<title>خدماتي | منصة موثوق</title>
<link rel="icon" type="image/png" href="mawthouq-logo.png">
<link rel="apple-touch-icon" href="mawthouq-logo.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1a2140">
<link rel="stylesheet" href="assets/style.css?v=31">
<link rel="stylesheet" href="assets/refresh.css?v=2">
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
  <button class="back-btn" onclick="goBack('index.html')" aria-label="رجوع">→</button>
  <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">م</span><span>منصة موثوق</span></a>
  </div>
  <nav><a href="provider-requests.html">طلبات الخدمة</a><a href="messages.html">رسائلي</a></nav>
  <div class="actions"><button class="ghost" onclick="logoutUser()">خروج</button></div>
</header>

<main style="padding:34px 7%;max-width:720px;margin:0 auto">
  <div class="heading">
    <div><div class="eyebrow">مقدّم خدمة</div><h1 style="margin:5px 0">خدماتي وأسعاري</h1></div>
  </div>
  <div class="notice">أضف كل خدمة تقدّمها مع سعرك الخاص بها (ر.ع). طالبو الخدمة يشوفون هذي الأسعار عند زيارة ملفك.</div>

  <div class="form" style="margin-bottom:10px">
    <div class="field full">
      <label>الخدمة</label>
      <select id="serviceTypeSelect"></select>
    </div>
    <div class="field">
      <label>السعر (ر.ع)</label>
      <input type="number" step="0.001" min="0.001" id="priceInput" placeholder="مثال: 20.000">
    </div>
    <div class="field" style="justify-content:flex-end">
      <button onclick="addProviderService()">إضافة الخدمة</button>
    </div>
  </div>

  <div class="table-wrap" style="margin-top:20px">
    <table>
      <thead><tr><th>الخدمة</th><th>السعر (ر.ع)</th><th></th></tr></thead>
      <tbody id="myServicesBody">
        <tr><td colspan="3"><div class="skeleton" style="width:100%"></div></td></tr>
      </tbody>
    </table>
    <div id="myServicesEmpty" class="empty-state" style="display:none">لم تضف أي خدمة بعد.</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js?v=31"></script>
<script src="assets/auth.js?v=31"></script>
<script src="assets/provider-services.js?v=31"></script>
</body>
</html>
